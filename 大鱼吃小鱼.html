<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐟 大鱼吃小鱼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #021a2e;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }

  /* HUD */
  #hud {
    position: absolute; top: 14px; left: 16px;
    color: #eaf6ff; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,20,40,.6);
    line-height: 1.4;
  }
  #lives { font-size: 22px; letter-spacing: 3px; margin-bottom: 2px; }
  #score { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  #score span { color: #ffd54a; }
  #level { font-size: 14px; opacity: .85; margin-left: 2px; }
  #combo { font-size: 15px; color: #7ee6ff; opacity: 0; transition: opacity .2s; }

  /* 大小进度条 */
  #sizebar {
    position: absolute; bottom: 20px; left: 16px; width: 200px;
    height: 10px; border-radius: 6px; background: rgba(255,255,255,.15);
    overflow: hidden; pointer-events: none;
  }
  #sizebar > i {
    display: block; height: 100%; width: 5%; border-radius: 6px;
    background: linear-gradient(90deg, #5bd7ff, #ffd54a, #ff7a59);
    transition: width .3s ease;
  }

  /* 音量/静音开关 */
  #soundToggle {
    position: absolute; top: 14px; right: 16px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(0,30,55,.45);
    color: #eaf6ff; font-size: 22px; line-height: 40px;
    text-align: center; cursor: pointer; user-select: none;
    -webkit-user-select: none; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    transition: transform .12s ease, background .12s ease;
  }
  #soundToggle:hover { background: rgba(0,45,80,.65); transform: scale(1.08); }
  #soundToggle:active { transform: scale(.94); }
  #soundToggle.muted { opacity: .65; }
  #soundToggle.muted::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 52%; height: 2px; background: #ff6a5e; border-radius: 2px;
    transform: translate(-50%,-50%) rotate(45deg);
  }

  /* 遮罩层 */
  .overlay {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(3,40,66,.55), rgba(1,15,28,.82));
    color: #fff; text-align: center; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 56px; font-weight: 800; letter-spacing: 4px;
    text-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  .title small { display: block; font-size: 18px; font-weight: 400; letter-spacing: 6px; opacity: .8; margin-top: 6px; }
  .hint { margin-top: 26px; font-size: 16px; opacity: .85; line-height: 1.9; }
  .hint b { color: #ffd54a; }
  .btn {
    margin-top: 30px; padding: 14px 46px; font-size: 20px; font-weight: 700;
    color: #043440; background: linear-gradient(180deg, #ffd54a, #ffb02e);
    border: none; border-radius: 50px; cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 6px 20px rgba(255,180,40,.45);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255,180,40,.6); }
  .btn:active { transform: translateY(1px); }
  .btn-row { margin-top: 30px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .btn-row .btn { margin-top: 0; }
  .btn-danger { color: #fff; background: linear-gradient(180deg, #ff8176, #e8483a); box-shadow: 0 6px 20px rgba(255,90,70,.45); }
  .btn-danger:hover { box-shadow: 0 10px 26px rgba(255,90,70,.6); }

  #gameover .title { font-size: 44px; color: #ff7a6e; }
  #gameover { background: radial-gradient(circle at 50% 40%, rgba(3,30,52,.45), rgba(1,12,24,.55)); }
  #final { font-size: 26px; margin-top: 14px; color: #ffd54a; font-weight: 700; }
  #best { font-size: 15px; margin-top: 8px; opacity: .8; }
  #fnew { font-size: 15px; margin-top: 4px; color: #7ee6ff; font-weight: 700; }

  #paused .title { font-size: 40px; }

  /* 挑战模式结局插图 */
  .end-img {
    max-width: 60%;
    max-height: 32vh;
    object-fit: contain;
    border-radius: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .end-score {
    font-size: 30px; font-weight: 700;
    color: #ffd54a; margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .end-new {
    font-size: 18px; color: #7ee6ff; font-weight: 700;
    margin-bottom: 16px;
  }
  .end-hint {
    font-size: 15px; opacity: .8; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="soundToggle" title="音效开关 (M)">🔊</div>

  <div id="hud">
    <div id="lives">❤️❤️❤️</div>
    <div id="score">得分 <span id="scoreVal">0</span></div>
    <div id="level">🐟 体型 <span id="levelVal">1 级</span></div>
    <div id="combo"></div>
  </div>
  <div id="sizebar"><i id="sizeFill"></i></div>

  <div id="start" class="overlay">
    <div class="title">大鱼吃小鱼<small>BIG FISH · EAT · SMALL FISH</small></div>
    <div class="hint">
      🖱️ <b>移动鼠标</b>（或手指滑动）控制你的小鱼<br>
      🐟 吃掉<b>比自己小</b>的鱼来长大<br>
      ⚠️ 躲开<b>比自己大</b>的鱼，被碰到会掉一条命<br>
      🍙 吃掉 <b>米粒 / 饭团 / 大盘饭</b> 也能快速长大<br>
      🐚 躲开 <b>藤壶</b>，碰到会<b>减速</b>你！<br>
      🔥 连续进食触发<b>连击加分</b>
    </div>
    <button class="btn" id="startBtn">普通模式 · 三条命</button>
      <button class="btn btn-danger" id="challengeBtn">挑战模式 · 一条命</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="title">游戏结束</div>
    <div id="final">得分 0</div>
    <div id="modeTag"></div>
    <div id="best"></div>
    <div id="fnew"></div>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>

  <div id="paused" class="overlay hidden">
    <div class="title">已暂停</div>
    <div class="hint">按 <b>Esc</b> 或 <b>P</b> 继续</div>
  </div>

  <!-- 挑战模式 · 满级称霸 -->
  <div id="challengeMax" class="overlay hidden">
    <img class="end-img" src="图片/deep-sea-boss.jpg" alt="深海鱼霸">
    <div class="end-score" id="cmScore">得分 0</div>
    <div class="end-new" id="cmNew">🌊 深海霸主！</div>
    <button class="btn" id="cmRestartBtn">再来一局</button>
  </div>

  <!-- 挑战模式 · 破纪录 -->
  <div id="challengeRecord" class="overlay hidden">
    <img class="end-img" src="图片/big-fish-end.jpg" alt="我不是大肥鱼">
    <div class="end-score" id="crScore">得分 0</div>
    <div class="end-new" id="crNew">🎉 新纪录！</div>
    <button class="btn" id="crRestartBtn">再来一局</button>
  </div>

  <!-- 挑战模式 · 没破纪录 -->
  <div id="challengeFail" class="overlay hidden">
    <img class="end-img" src="图片/hungry-end.jpg" alt="没吃饱喵">
    <div class="end-score" id="cfScore">得分 0</div>
    <div class="end-hint">最高记录 <span id="cfBest">0</span></div>
    <button class="btn" id="cfRestartBtn">再来一局</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const $ = id => document.getElementById(id);
  const scoreVal = $("scoreVal"), levelVal = $("levelVal"), sizeFill = $("sizeFill"),
        comboEl = $("combo"), startOv = $("start"), overOv = $("gameover"),
        finalEl = $("final"), bestEl = $("best"), fnewEl = $("fnew"), pausedOv = $("paused"),
        livesEl = $("lives"), modeTag = $("modeTag"),
        challengeMax = $("challengeMax"), challengeRecord = $("challengeRecord"), challengeFail = $("challengeFail"),
        cmScore = $("cmScore"), crScore = $("crScore"), cfScore = $("cfScore"), cfBest = $("cfBest");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 音效引擎 (Web Audio API 合成) ----------
  const Sound = (() => {
    let ctx = null;
    let master = null;          // 主增益节点，统一控制音量/静音
    let musicGain = null;       // 背景音乐专用增益
    let muted = false;          // 是否静音
    let musicTimer = null;      // 背景音乐调度句柄

    try { muted = localStorage.getItem("bigFishMuted") === "1"; } catch (e) {}

    // 创建/恢复音频上下文。必须在用户手势内调用一次以保证浏览器允许出声。
    function ac() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;   // 环境不支持 Web Audio，静默降级
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ctx.destination);
        musicGain = ctx.createGain();
        musicGain.gain.value = 0.5;
        musicGain.connect(master);
      }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
      return ctx;
    }

    // 用户手势内显式解锁音频（解决首次点击无声音）
    function unlock() {
      const c = ac();
      if (c && c.state === "suspended") c.resume();
    }

    function setMuted(m) {
      muted = m;
      if (ctx && master) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.01);
      if (m) this.stopMusic(); else this.startMusic();
      try { localStorage.setItem("bigFishMuted", m ? "1" : "0"); } catch (e) {}
    }
    function isMuted() { return muted; }

    function tone(freq, dur, type = "sine", vol = 0.12) {
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur);
    }
    function sweep(f1, f2, dur, type = "sine", vol = 0.12) {
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur);
    }
    function noise(dur, vol = 0.04) {
      const c = ac(); if (!c) return;
      const t = c.currentTime;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf;
      const g = c.createGain(); g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const flt = c.createBiquadFilter(); flt.type = "lowpass";
      flt.frequency.setValueAtTime(500, t);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur);
    }
    return {
      unlock,
      setMuted,
      isMuted,
      eat(pitch = 1) {
        sweep(170 * pitch, 520 * pitch, 0.11, "sine", 0.10);
        noise(0.05, 0.025);
      },
      comboEat(lv) {
        const p = 1 + lv * 0.12;
        sweep(200 * p, 700 * p, 0.09, "sine", 0.13);
        noise(0.04, 0.035);
      },
      hurt() {
        sweep(140, 45, 0.32, "sawtooth", 0.09);
        noise(0.18, 0.05);
      },
      gameOver() {
        const c = ac(); if (!c) return;
        this.stopMusic();
        const t = c.currentTime;
        [380, 300, 220, 130].forEach((f, i) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = "triangle"; o.frequency.setValueAtTime(f, t + i * 0.18);
          g.gain.setValueAtTime(0.09, t + i * 0.18);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.18 + 0.28);
          o.connect(g); g.connect(master);
          o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.32);
        });
      },
      pickup(type = "rice") {
        const c = ac(); if (!c) return;
        const m = { rice: [620, 820], onigiri: [500, 920], sushi: [380, 1100] };
        const [a, b] = m[type] || [600, 800];
        // 用 Web Audio 精确调度代替 setTimeout，避免叠加延迟/堆积
        const t = c.currentTime;
        const play = (freq, dur, at) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = "sine"; o.frequency.setValueAtTime(freq, at);
          g.gain.setValueAtTime(0.10, at);
          g.gain.exponentialRampToValueAtTime(0.001, at + dur);
          o.connect(g); g.connect(master);
          o.start(at); o.stop(at + dur);
        };
        play(a, 0.07, t);
        play(b, 0.11, t + 0.055);
      },
      bounce() { tone(75, 0.05, "triangle", 0.05); },
      grow()  { sweep(190, 360, 0.17, "sine", 0.05); },
      slow()  { sweep(220, 55, 0.42, "sawtooth", 0.11); noise(0.28, 0.04); },
      start() {
        const c = ac(); if (!c) return;
        const t = c.currentTime;
        [262, 330, 392, 523].forEach((f, i) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = "sine"; o.frequency.setValueAtTime(f, t + i * 0.09);
          g.gain.setValueAtTime(0.07, t + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.22);
          o.connect(g); g.connect(master);
          o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.24);
        });
        this.startMusic();
      },
      // 背景音乐：舒缓的海底旋律，循环播放
      startMusic() {
        const c = ac(); if (!c || muted) return;
        this.stopMusic();
        // 和弦进行：C - Am - F - G，对应琶音
        const chords = [
          [261.6, 329.6, 392.0], // C
          [220.0, 261.6, 329.6], // Am
          [174.6, 220.0, 261.6], // F
          [196.0, 246.9, 293.7], // G
        ];
        let next = c.currentTime + 0.1;
        let step = 0;
        const playStep = () => {
          const c = ac(); if (!c || muted) return;
          const chord = chords[Math.floor(step / 6) % chords.length];
          const note = chord[step % 3];
          const o = c.createOscillator(), g = c.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(note, next);
          // 主音渐弱、渐出，避免刺耳
          g.gain.setValueAtTime(0.0001, next);
          g.gain.exponentialRampToValueAtTime(0.05, next + 0.05);
          g.gain.exponentialRampToValueAtTime(0.0001, next + 1.2);
          o.connect(g); g.connect(musicGain);
          o.start(next); o.stop(next + 1.6);
          next += 0.42;
          step++;
          // 每个小节的低音衬托（每 6 步一个根音）
          if (step % 6 === 0) {
            const root = chords[Math.floor(step / 6) % chords.length][0] / 2;
            const bo = c.createOscillator(), bg = c.createGain();
            bo.type = "sine"; bo.frequency.setValueAtTime(root, next - 0.42);
            bg.gain.setValueAtTime(0.06, next - 0.42);
            bg.gain.exponentialRampToValueAtTime(0.0001, next - 0.42 + 0.6);
            bo.connect(bg); bg.connect(musicGain);
            bo.start(next - 0.42); bo.stop(next - 0.42 + 0.7);
          }
          // 持续调度，永不停止（loop）
          musicTimer = setTimeout(playStep, (next - c.currentTime) * 1000);
        };
        playStep();
      },
      stopMusic() {
        if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
      }
    };
  })();

  // ---------- 工具 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (x1, y1, x2, y2) => { const dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; };

  // ---------- 玩家图片（自定义形象）----------
  // 把原图（角色朝左）水平镜像成朝右，随 angle 朝向运动方向
  function flippedCanvas(img) {
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const g = c.getContext("2d");
    g.translate(c.width, 0); g.scale(-1, 1);         // 水平镜像
    g.drawImage(img, 0, 0);
    return c;
  }

  let playerImg = new Image();
  let playerImgReady = false;
  let playerImgFlipped = null; // 正常形象（翻转后）
  playerImg.onload = () => {
    try {
      playerImgFlipped = flippedCanvas(playerImg);
      playerImgReady = true;
    } catch (e) { playerImgReady = false; }
  };
  playerImg.onerror = () => { playerImgReady = false; };
  playerImg.src = "图片/player.png";

  // 寄生形象（碰到藤壶减速时切换成这张，减速结束后恢复原图）
  let parasiteImg = new Image();
  let parasiteImgReady = false;
  let parasiteImgFlipped = null; // 寄生形象（翻转后）
  parasiteImg.onload = () => {
    try {
      parasiteImgFlipped = flippedCanvas(parasiteImg);
      parasiteImgReady = true;
    } catch (e) { parasiteImgReady = false; }
  };
  parasiteImg.onerror = () => { parasiteImgReady = false; };
  parasiteImg.src = "图片/parasite.png";

  // 藤壶道具展示图（去底透明 PNG，掉落道具用）
  let barnacleImg = new Image();
  let barnacleImgReady = false;
  barnacleImg.onload = () => { barnacleImgReady = true; };
  barnacleImg.onerror = () => { barnacleImgReady = false; };
  barnacleImg.src = "图片/barnacle.png";

  // ---------- 游戏状态 ----------
  let player, fishes, bubbles, plants, particles, items;
  let score = 0, combo = 0, comboTimer = 0, status = "idle"; // idle | playing | over | paused
  let mode = "normal", lives = 3, invincible = 0; // normal = 三命, challenge = 一命
  let slowTimer = 0; // 藤壶减速剩余时间（秒）
  let best = 0;
  try { best = parseInt(localStorage.getItem("bigFishBest") || "0", 10) || 0; } catch (e) {}

  // 体型等级阈值：每升一级体型 +8
  const growthPerLevel = 8;
  const START_R = 34;   // 初始体型（即 1 级基准）
  const MAX_R = 140;    // 体型上限
  const SLOW_DURATION = 3.5;  // 藤壶减速持续时间（秒）
  const SLOW_FACTOR = 0.25;   // 藤壶把追近速度降到 25%（明显变慢）
  const SLOW_MAX_SPEED = 80;  // 藤壶减速时的硬速度上限（px/秒），体感像被拖住

  function reset() {
    player = {
      x: W / 2, y: H / 2, r: START_R, angle: 0,
      vx: 0, vy: 0,
      hue: 215,
    };
    fishes = [];
    bubbles = [];
    particles = [];
    items = [];
    for (let i = 0; i < 3; i++) spawnItem();
    score = 0; combo = 0; comboTimer = 0; slowTimer = 0;
    // 初始生成
    for (let i = 0; i < 26; i++) spawnFish(true);
    for (let i = 0; i < 40; i++) bubbles.push(makeBubble(true));
    makePlants();
    updateHUD();
  }

  // ---------- 鱼 ----------
  function makeFish(opts) {
    return Object.assign({
      x: 0, y: 0, vx: 0, vy: 0, r: 20,
      hue: 200, speed: 50, angle: 0, turnTimer: 0, targetAngle: 0,
      dead: false, flee: false, type: "ai"
    }, opts);
  }

  // 生成一只 AI 鱼（按玩家大小决定大小鱼）
  function spawnFish(initial) {
    let r, hue, speed, x, y, bigRatio;
    const pr = player.r;

    if (initial) {
      // 开局大量小鱼、少量温和的大鱼
      bigRatio = rand(0.25, 0.6);
      if (Math.random() < 0.18) {
        r = rand(pr * 1.15, pr * 1.35);     // 开局大鱼：尺寸温和
      } else {
        r = rand(pr * 0.4, pr * 0.85);      // 小鱼
      }
    } else {
      bigRatio = rand(0.3, 1.15);
      // 按玩家体型动态生成——降低大鱼占比，补充相近体型(互相撞开)，保证中后期有活路
      const roll = Math.random();
      if (roll < 0.12) {
        r = rand(pr * 1.1, pr * 1.3);    // 大鱼：约12%，有威胁但不泛滥
      } else if (roll < 0.42) {
        r = rand(pr * 0.85, pr * 1.12);  // 相近体型：约30%，互相撞开(不互吃不掉命)
      } else {
        r = rand(pr * 0.4, pr * 0.8);    // 明显小鱼：约58%，可吃
      }
    }

    // 颜色按体型：越大越偏红/暖色，越小偏蓝绿冷色
    hue = clamp(200 - (r - 15) * 1.6, 160, 210) + rand(-12, 12);
    if (r > pr + 10) hue = rand(-5, 25);       // 大鱼偏红橙
    speed = clamp(rand(35, 70) * (60 / r), 30, 120);
    bigRatio = r / Math.max(pr, 1);

    // 从边缘外生成
    const side = randInt(0, 3);
    if (side === 0) { x = -50; y = rand(0, H); }
    else if (side === 1) { x = W + 50; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = -50; }
    else { x = rand(0, W); y = H + 50; }

    const a = rand(0, Math.PI * 2);
    fishes.push(makeFish({
      x, y, r, hue, speed,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      angle: a,
      big: bigRatio > 1.18
    }));
  }

  function updateFish(f, dt) {
    // 目标方向：正常随机游走；小鱼的逃跑逻辑在玩家碰撞附近处理
    f.turnTimer -= dt;
    if (f.turnTimer <= 0) {
      f.turnTimer = rand(1.2, 3.2);
      f.targetAngle = rand(0, Math.PI * 2);
    }

    let tx = f.vx, ty = f.vy;
    const spd = f.speed;

    // 遇玩家：小鱼逃跑、大鱼轻微追击
    if (status === "playing") {
      const d = Math.hypot(player.x - f.x, player.y - f.y);
      if (d < 230) {
        const away = Math.atan2(f.y - player.y, f.x - player.x);
        const big = f.r > player.r * 1.2; // 实时判断相对体型
        if (big && invincible <= 0) {
          // 大鱼追击（无敌期间放弃追击，给玩家喘息）
          const to = Math.atan2(player.y - f.y, player.x - f.x);
          f.targetAngle = to + rand(-0.7, 0.7);
        } else {
          f.targetAngle = away + rand(-0.5, 0.5);
        }
      }
    }

    const cur = Math.atan2(f.vy, f.vx);
    let diff = f.targetAngle - cur;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const na = cur + diff * Math.min(1, dt * 2.5);
    tx = Math.cos(na) * spd;
    ty = Math.sin(na) * spd;
    f.angle = na;

    f.vx += (tx - f.vx) * Math.min(1, dt * 3);
    f.vy += (ty - f.vy) * Math.min(1, dt * 3);
    f.x += f.vx * dt;
    f.y += f.vy * dt;

    // 出界移除
    const m = 80;
    if (f.x < -m || f.x > W + m || f.y < -m || f.y > H + m) f.dead = true;
  }

  // ---------- 玩家 ----------
  let targetX = W / 2, targetY = H / 2;
  function updatePlayer(dt) {
    // 藤壶减速倒计时
    if (slowTimer > 0) slowTimer -= dt;

    targetX = clamp(targetX, -60, W + 60);
    targetY = clamp(targetY, -60, H + 60);

    // 直接位置缓动：跟手顺滑、无惯性滑行（手感自然）
    // 体型越大追踪略慢更笨重；藤壶减速时追近速度大幅降低 + 硬速度上限
    const sizeFactor = clamp(1 - (player.r - START_R) / (MAX_R - START_R) * 0.3, 0.7, 1);
    let k = Math.min(1, dt * 6.5 * sizeFactor);
    if (slowTimer > 0) k *= SLOW_FACTOR;

    let dx = targetX - player.x;
    let dy = targetY - player.y;
    let mx = dx * k, my = dy * k;
    // 藤壶减速硬限速：每帧最多移动一小段，体感明显"被拖住"
    if (slowTimer > 0) {
      const maxMove = SLOW_MAX_SPEED * dt;
      const mv = Math.hypot(mx, my);
      if (mv > maxMove) { mx = mx / mv * maxMove; my = my / mv * maxMove; }
    }
    player.x += mx;
    player.y += my;

    // 朝向（按移动方向，位移很小时保持）
    if (Math.hypot(dx, dy) > 2) player.angle = Math.atan2(dy, dx);
  }

  // ---------- 碰撞与进食 ----------
  function checkEating() {
    const pr = player.r;
    for (const f of fishes) {
      if (f.dead) continue;
      const rsum = pr + f.r - 6;
      if (dist2(player.x, player.y, f.x, f.y) > rsum * rsum) continue;

      if (pr >= f.r * 1.05) {
        // 吃掉（玩家略大即可吃，中立区收窄，更直观）
        f.dead = true;
        const gain = Math.round(f.r * 2);
        combo++; comboTimer = 2.4;
        const bonus = combo >= 2 ? Math.round(gain * 0.5 * Math.min(combo, 6)) : 0;
        score += gain + bonus;
        grow(gain);
        combo >= 3 ? Sound.comboEat(combo) : Sound.eat();
        burst(f.x, f.y, f.hue, gain + bonus);
      } else if (f.r >= pr * 1.15) {
        // 致命：比玩家大 15% 以上就掉命（中立区收窄）
        if (invincible <= 0) {
          lives--;
          Sound.hurt();
          burst(player.x, player.y, 0, 18); // 体型缩小 + 沿反方向弹开，脱离鱼群
          player.r = clamp(player.r * 0.85, 20, MAX_R);
          const kdx = player.x - f.x, kdy = player.y - f.y;
          const kd = Math.hypot(kdx, kdy) || 1;
          player.x += (kdx / kd) * 50;
          player.y += (kdy / kd) * 50;
          if (lives <= 0) { gameOver(); return; }
          invincible = 3;
        }
        break;
      } else {
        // 中性区：势均力敌，互相弹开（不互吃、不掉命）
        bounce(f);
      }
    }
    fishes = fishes.filter(f => !f.dead);
  }

  // AI 大鱼吃小鱼：体型更小的 AI 鱼会被更大的 AI 鱼吃掉，但不长体型
  function checkAIEating() {
    for (let i = 0; i < fishes.length; i++) {
      const a = fishes[i];
      if (a.dead) continue;
      for (let j = i + 1; j < fishes.length; j++) {
        const b = fishes[j];
        if (b.dead) continue;
        const rsum = a.r + b.r - 4;
        if (dist2(a.x, a.y, b.x, b.y) > rsum * rsum) continue;
        // 明显更大的那方吃掉另一方（阈值 1.2 倍），被吃方消失，吃方不变大
        if (a.r >= b.r * 1.2) {
          b.dead = true;
          burst(b.x, b.y, b.hue, 5);
        } else if (b.r >= a.r * 1.2) {
          a.dead = true;
          burst(a.x, a.y, a.hue, 5);
        } else {
          // 体型相近：互相推开，避免重叠穿模
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.hypot(dx, dy) || 1;
          const overlap = (a.r + b.r) - d;
          if (overlap > 0) {
            const ux = dx / d, uy = dy / d;
            a.x += ux * overlap * 0.5;
            a.y += uy * overlap * 0.5;
            b.x -= ux * overlap * 0.5;
            b.y -= uy * overlap * 0.5;
          }
        }
      }
    }
    fishes = fishes.filter(f => !f.dead);
  }

  // 势均力敌的碰撞：把双方推开，避免叠着穿模
  function bounce(f) {
    const dx = player.x - f.x, dy = player.y - f.y;
    const d = Math.hypot(dx, dy) || 1;
    const overlap = (player.r + f.r) - d;
    if (overlap <= 0) return;
    const ux = dx / d, uy = dy / d;
    player.x += ux * overlap * 0.55;
    player.y += uy * overlap * 0.55;
    f.x -= ux * overlap * 0.45;
    f.y -= uy * overlap * 0.45;
    player.vx += ux * 160;
    player.vy += uy * 160;
    f.vx -= ux * 120;
    f.vy -= uy * 120;
    Sound.bounce();
  }

  function grow(mass) {
    const r = player.r;
    player.r = Math.sqrt(r * r + mass * 2.2); // 面积增长，慢慢长大
    player.r = clamp(player.r, 20, MAX_R);
    Sound.grow();
  }
  function makeParticle(x, y, hue) {
    return {
      x, y, hue,
      vx: rand(-120, 120), vy: rand(-120, 120),
      life: rand(0.4, 0.8), age: 0, r: rand(2, 5)
    };
  }
  function burst(x, y, hue, count) {
    const n = Math.min(count, 14);
    for (let i = 0; i < n; i++) particles.push(makeParticle(x, y, hue));
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.age += dt;
    }
    particles = particles.filter(p => p.age < p.life);
  }

  // ---------- 道具（米粒/饭团/大盘饭，从上往下掉，吃掉变大体型）----------
  const ITEM_TYPES = [
    { type: "rice",     label: "米粒",   r: 9,  grow: 1.5, weight: 55 },
    { type: "onigiri",  label: "饭团",   r: 15, grow: 4,   weight: 35 },
    { type: "sushi",    label: "大盘饭", r: 24, grow: 10,  weight: 12 },
    { type: "barnacle", label: "藤壶",   r: 20, grow: 0,   weight: 15 },
  ];

  function pickItemType() {
    const total = ITEM_TYPES.reduce((s, t) => s + t.weight, 0);
    let roll = Math.random() * total;
    for (const t of ITEM_TYPES) { roll -= t.weight; if (roll <= 0) return t; }
    return ITEM_TYPES[0];
  }

  function spawnItem() {
    const t = pickItemType();
    items.push({
      x: rand(30, W - 30), y: -40,
      type: t, r: t.r,
      vy: rand(18, 36), sway: rand(0, Math.PI * 2), swaySpeed: rand(1, 2.4),
      eaten: false
    });
  }

  function updateItems(dt) {
    for (const it of items) {
      it.y += it.vy * dt;
      it.sway += it.swaySpeed * dt;
      it.x += Math.sin(it.sway) * 0.7;
    }
    items = items.filter(it => it.y < H + 50);
    // 控制场上道具数量，从顶部慢慢补充
    if (items.length < 6 && Math.random() < 0.025) spawnItem();
  }

  function growBy(delta) {
    player.r = clamp(player.r + delta, 20, MAX_R);
  }

  function checkItemCollision() {
    const pr = player.r * 1.2;
    for (const it of items) {
      const rs = pr + it.r;
      if (dist2(player.x, player.y, it.x, it.y) > rs * rs) continue;
      it.eaten = true;
      if (it.type.type === "barnacle") {
        // 藤壶：陷阱，减速玩家，不加分不成长
        slowTimer = SLOW_DURATION;
        Sound.slow();
        burst(it.x, it.y, 0, 12);
      } else {
        Sound.pickup(it.type.type);
        growBy(it.type.grow);
        score += 5;
        const hue = it.type.type === "rice" ? 50 : (it.type.type === "onigiri" ? 30 : 25);
        burst(it.x, it.y, hue, 8);
      }
    }
    items = items.filter(it => !it.eaten);
  }

  // 惊恐表情绘制（八字眉 + 大圆眼高光 + O 型小嘴），藤壶与玩家被黏时共用
  function drawPanicFace(r) {
    // 八字眉（内端下压，委屈皱眉）
    ctx.strokeStyle = "#7a6f60";
    ctx.lineWidth = Math.max(1.2, r * 0.045);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-r * 0.32, -r * 0.18); ctx.lineTo(-r * 0.12, -r * 0.07);
    ctx.moveTo(r * 0.32, -r * 0.18); ctx.lineTo(r * 0.12, -r * 0.07);
    ctx.stroke();
    // 大黑点眼睛（惊恐瞪圆）
    ctx.fillStyle = "#2b2b2b";
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.02, r * 0.085, 0, Math.PI * 2);
    ctx.arc(r * 0.2, -r * 0.02, r * 0.085, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛高光（更大，显惊恐水汪汪）
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-r * 0.23, -r * 0.05, r * 0.032, 0, Math.PI * 2);
    ctx.arc(r * 0.17, -r * 0.05, r * 0.032, 0, Math.PI * 2);
    ctx.fill();
    // 惊恐微张的小嘴（O 型）
    ctx.fillStyle = "#4a2f2f";
    ctx.beginPath();
    ctx.ellipse(0, r * 0.18, r * 0.075, r * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 藤壶壳绘制（参考立体藤壶：米白火山锥壳 + 深蓝近黑开口 + 白色壳片与灰褐小点 + 蓝色反光 + 底部挂水珠）
  function drawBarnacleShape(r, sway) {
    const ph = performance.now() / 380;

    // 外壳主体：上窄下宽的火山锥，米白冷灰渐变（中部受光、两侧冷灰阴影）
    const shell = ctx.createLinearGradient(-r * 0.8, 0, r * 0.8, 0);
    shell.addColorStop(0, "#d8d5cc");
    shell.addColorStop(0.45, "#f6f3ea");
    shell.addColorStop(1, "#c4c1b8");
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.moveTo(-r * 0.82, r * 0.6);
    ctx.quadraticCurveTo(-r * 0.6, -r * 0.08, -r * 0.38, -r * 0.78);
    ctx.lineTo(r * 0.38, -r * 0.78);
    ctx.quadraticCurveTo(r * 0.6, -r * 0.08, r * 0.82, r * 0.6);
    ctx.quadraticCurveTo(0, r * 0.78, -r * 0.82, r * 0.6);
    ctx.closePath();
    ctx.fill();

    // 壳身横向生长环（灰褐细线，随锥体向下逐渐加宽）
    ctx.strokeStyle = "rgba(148,140,124,0.55)";
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const t = 0.2 + i * 0.26;
      const yy = -r * 0.74 + t * r * 1.4;
      const w = r * (0.36 + t * 0.46);
      ctx.beginPath();
      ctx.moveTo(-w, yy);
      ctx.quadraticCurveTo(0, yy + r * 0.08, w, yy);
      ctx.stroke();
    }

    // 壳身纵向棱纹（火山锥质感）
    ctx.strokeStyle = "rgba(178,172,156,0.5)";
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.1, -r * 0.52);
      ctx.quadraticCurveTo(i * r * 0.14, r * 0.05, i * r * 0.16, r * 0.62);
      ctx.stroke();
    }

    // 顶部深蓝近黑开口（吸附器官内部）
    ctx.fillStyle = "#1a2650";
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.78, r * 0.38, r * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0a0f24";
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.78, r * 0.23, r * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // 开口外缘一圈白色小壳片（沿顶部弧线向外张开）
    ctx.fillStyle = "#faf8f1";
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * (0.04 + i / 8 * 0.92); // 顶部 0.04π~0.96π
      const nx = Math.cos(a), ny = Math.sin(a);
      const px = nx * r * 0.34;
      const py = -r * 0.78 + ny * r * 0.11;
      const tipX = px + nx * r * 0.13;
      const tipY = py + ny * r * 0.11;
      const tx = -ny, ty = nx;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(px + tx * r * 0.05, py + ty * r * 0.05);
      ctx.lineTo(px - tx * r * 0.05, py - ty * r * 0.05);
      ctx.closePath();
      ctx.fill();
    }

    // 开口下方一圈灰褐色小点（生长环纹理）
    ctx.fillStyle = "rgba(122,112,90,0.6)";
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (0.1 + i / 6 * 0.8);
      const px = Math.cos(a) * r * 0.33;
      const py = -r * 0.78 + Math.sin(a) * r * 0.17 + r * 0.08;
      ctx.beginPath();
      ctx.arc(px, py, r * 0.03, 0, Math.PI * 2);
      ctx.fill();
    }

    // 左侧蓝色湿润反光（两道弧形高光）
    ctx.strokeStyle = "rgba(150,210,255,0.55)";
    ctx.lineWidth = r * 0.09;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(-r * 0.1, r * 0.02, r * 0.56, Math.PI * 1.02, Math.PI * 1.42);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = r * 0.04;
    ctx.beginPath();
    ctx.arc(-r * 0.12, r * 0.0, r * 0.5, Math.PI * 1.08, Math.PI * 1.36);
    ctx.stroke();

    // 底部悬挂的蓝白透明水珠（微微摆动，带高光）
    for (let i = 0; i < 2; i++) {
      const bx = (i - 0.5) * r * 0.52 + Math.sin(sway + i * 0.9 + ph) * r * 0.08;
      const by = r * (0.72 + i * 0.16) + Math.sin(sway + ph + i * 2.1) * r * 0.05;
      const br = r * (0.15 - i * 0.045);
      ctx.fillStyle = "rgba(130,205,255,0.6)";
      ctx.beginPath();
      ctx.moveTo(bx, by - br);
      ctx.quadraticCurveTo(bx + br, by + br * 0.25, bx, by + br);
      ctx.quadraticCurveTo(bx - br, by + br * 0.25, bx, by - br);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(bx - br * 0.3, by - br * 0.35, br * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawItem(it) {
    const { type, r } = it;
    ctx.save();
    ctx.translate(it.x, it.y);

    if (type.type === "rice") {
      // 米粒
      ctx.save();
      ctx.rotate(0.7 + Math.sin(it.sway) * 0.25);
      ctx.fillStyle = "#fffdf2";
      ctx.strokeStyle = "rgba(190,150,80,0.4)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (type.type === "onigiri") {
      // 三角饭团 + 海苔
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.15);
      ctx.quadraticCurveTo(r * 0.92, -r * 0.2, r * 0.9, r * 0.5);
      ctx.quadraticCurveTo(r * 0.86, r * 0.78, 0, r * 0.78);
      ctx.quadraticCurveTo(-r * 0.86, r * 0.78, -r * 0.9, r * 0.5);
      ctx.quadraticCurveTo(-r * 0.92, -r * 0.2, 0, -r * 1.15);
      ctx.fill();
      ctx.fillStyle = "#2c3e33";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.4, r * 0.72, r * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (type.type === "sushi") {
      // 大盘饭：大白盘 + 鼓起的白米饭 + 冒热气
      // 盘子底与盘沿
      ctx.fillStyle = "#e6dcc8";
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#c9b894"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.38, 0, 0, Math.PI * 2); ctx.stroke();
      // 鼓起的白米饭
      ctx.fillStyle = "#fffdf4";
      ctx.beginPath(); ctx.ellipse(0, -r * 0.18, r * 0.85, r * 0.36, 0, Math.PI, Math.PI * 2); ctx.fill();
      // 米粒斑点
      ctx.fillStyle = "rgba(235,220,180,0.75)";
      for (let k = 0; k < 5; k++) {
        ctx.beginPath();
        ctx.ellipse(Math.cos(k * 1.4) * r * 0.45, -r * 0.32 - Math.abs(Math.sin(k * 1.3)) * r * 0.18, r * 0.06, r * 0.04, k, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type.type === "barnacle") {
      // 藤壶道具：使用去底透明展示图；未就绪时回退为程序绘制
      if (barnacleImgReady && barnacleImg) {
        const s = r * 2.6;
        const bob = Math.sin(it.sway) * r * 0.14;
        ctx.drawImage(barnacleImg, -s / 2, -s / 2 + bob, s, s);
      } else {
        drawBarnacleShape(r, it.sway);
      }
    }

    // 呼吸光圈提示（藤壶用警示橙，食物用白色）
    ctx.strokeStyle = type.type === "barnacle" ? "rgba(255,150,80,0.7)" : "rgba(255,255,255,0.4)";
    ctx.lineWidth = type.type === "barnacle" ? 2.2 : 1.5;
    const visualR = type.type === "barnacle" ? r * 1.4 : r;
    const pulse = visualR + 5 + Math.sin(performance.now() / 250) * 1.6;
    ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI * 2); ctx.stroke();

    ctx.restore();
  }

  // ---------- 气泡 ----------
  function makeBubble(initial) {
    return {
      x: rand(0, W), y: initial ? rand(0, H) : H + 20,
      r: rand(2, 7), vy: rand(-60, -20), wob: rand(0, Math.PI * 2)
    };
  }
  function updateBubbles(dt) {
    for (const b of bubbles) {
      b.y += b.vy * dt;
      b.wob += dt * 2;
      b.x += Math.sin(b.wob) * 0.4;
      if (b.y < -20) Object.assign(b, makeBubble(false));
    }
  }

  // ---------- 水草 ----------
  function makePlants() {
    plants = [];
    const n = Math.max(6, Math.floor(W / 130));
    for (let i = 0; i < n; i++) {
      const x = rand(30, W - 30), baseY = rand(H * 0.75, H - 30);
      plants.push({
        x, baseY, h: rand(70, 180), sway: rand(0, Math.PI * 2),
        hue: rand(90, 160), seg: randInt(5, 8)
      });
    }
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b3e63");
    g.addColorStop(0.5, "#07456e");
    g.addColorStop(1, "#031f38");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 光线束
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    for (let i = 0; i < 5; i++) {
      const x = W * (i + 0.5) / 5 + Math.sin(performance.now() / 9000 + i) * 30;
      const lg = ctx.createLinearGradient(x, 0, x, H * 0.7);
      lg.addColorStop(0, "rgba(160,220,255,0.10)");
      lg.addColorStop(1, "rgba(160,220,255,0)");
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x - 60, 0); ctx.lineTo(x + 60, 0);
      ctx.lineTo(x + 120, H * 0.7); ctx.lineTo(x - 120, H * 0.7);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlants() {
    for (const p of plants) {
      const t = performance.now() / 1000;
      ctx.save();
      ctx.strokeStyle = `hsla(${p.hue}, 55%, 42%, 0.9)`;
      ctx.lineCap = "round";
      ctx.beginPath();
      let px = p.x, py = p.baseY;
      ctx.moveTo(px, py);
      for (let i = 0; i < p.seg; i++) {
        const sway = Math.sin(t * 1.4 + p.sway + i * 0.6) * (4 + i * 3);
        px += sway; py -= p.h / p.seg;
        ctx.lineTo(px, py);
      }
      ctx.lineWidth = 5;
      ctx.stroke();
      // 叶子
      ctx.fillStyle = `hsla(${p.hue}, 55%, 45%, 0.9)`;
      const ly = py - p.h / p.seg / 2;
      ctx.beginPath();
      ctx.ellipse(px, ly, 14, 6, Math.sin(t + p.sway) * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFish(f, isPlayer) {
    const { x, y, r, angle, hue } = f;
    ctx.save();
    if (isPlayer && invincible > 0) {
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(performance.now() / 60));
    }
    // 玩家使用自定义图片形象
    if (isPlayer && playerImgReady && playerImgFlipped) {
      ctx.translate(x, y);
      ctx.rotate(angle);
      const size = r * 2.2;                      // 与玩家体型匹配的显示尺寸
      // 藤壶减速期间：切换成「被寄生」形象；减速结束后恢复原图
      const isParasite = slowTimer > 0 && parasiteImgReady && parasiteImgFlipped;
      ctx.drawImage(isParasite ? parasiteImgFlipped : playerImgFlipped,
                    -size / 2, -size / 2, size, size);
      // 藤壶减速：围绕玩家的淡蓝光环提示（寄生形象本身已含藤壶与惊恐表情）
      if (slowTimer > 0) {
        const pulse = size * 0.6 + Math.sin(performance.now() / 120) * 3;
        ctx.strokeStyle = "rgba(120,190,255," + (0.4 + 0.25 * Math.sin(performance.now() / 150)) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(120,190,255,0.12)";
        ctx.beginPath();
        ctx.arc(0, 0, pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 可吃/危险指示光圈（仅 AI 鱼）：绿=能吃，红=危险，无圈=势均力敌
    if (!isPlayer && status === "playing") {
      const pr = player.r;
      let ringColor = null;
      if (pr >= f.r * 1.05) ringColor = "rgba(80,255,160,0.55)";   // 可比玩家小 → 能吃
      else if (f.r >= pr * 1.15) ringColor = "rgba(255,90,80,0.6)"; // 比玩家大15%+ → 危险
      if (ringColor) {
        const pulse = r * 1.35 + Math.sin(performance.now() / 220 + x) * 2;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, pulse, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    const bodyLen = r * (isPlayer ? 2.1 : 2.4);
    const sat = isPlayer ? 88 : 70;
    const light = isPlayer ? 60 : 55;

    // 尾巴（摆动）
    const wag = Math.sin(performance.now() / 130 + x) * 0.4;
    ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light - 12}%)`;
    ctx.beginPath();
    ctx.moveTo(-bodyLen * 0.38, 0);
    ctx.quadraticCurveTo(-bodyLen * 0.72, -r * 0.75 + wag * r, -bodyLen * 0.82, -r * 0.9 + wag * r);
    ctx.quadraticCurveTo(-bodyLen * 0.68, 0, -bodyLen * 0.82, r * 0.9 + wag * r);
    ctx.quadraticCurveTo(-bodyLen * 0.72, r * 0.75 - wag * r, -bodyLen * 0.38, 0);
    ctx.fill();

    // 身体（玩家鱼更短更圆胖 = 大肥鱼）
    const bodyRy = isPlayer ? r * 1.35 : r;
    const bg = ctx.createRadialGradient(r * 0.2, -r * 0.3, r * 0.1, 0, 0, r * 1.1);
    bg.addColorStop(0, `hsl(${hue}, ${sat}%, ${light + 20}%)`);
    bg.addColorStop(1, `hsl(${hue}, ${sat}%, ${light}%)`);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.5, bodyRy, 0, 0, Math.PI * 2);
    ctx.fill();

    // 玩家鱼：鼓鼓的大肚子高光
    if (isPlayer) {
      ctx.fillStyle = `hsla(${hue}, 92%, 78%, 0.35)`;
      ctx.beginPath();
      ctx.ellipse(-bodyLen * 0.08, bodyRy * 0.42, bodyLen * 0.28, bodyRy * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 背鳍
    ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light - 5}%)`;
    ctx.beginPath();
    ctx.moveTo(-bodyLen * 0.12, -r * 0.7);
    ctx.quadraticCurveTo(bodyLen * 0.02, -r * 1.35, bodyLen * 0.18, -r * 0.6);
    ctx.closePath(); ctx.fill();

    // 腹鳍
    ctx.beginPath();
    ctx.moveTo(-bodyLen * 0.08, r * 0.55);
    ctx.quadraticCurveTo(bodyLen * 0.06, r * 1.1, bodyLen * 0.16, r * 0.5);
    ctx.closePath(); ctx.fill();

    // 眼睛
    const ex = bodyLen * 0.24, ey = -r * 0.12, er = r * 0.3;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b1a24";
    ctx.beginPath(); ctx.arc(ex + er * 0.25, ey, er * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ex + er * 0.35, ey - er * 0.15, er * 0.2, 0, Math.PI * 2); ctx.fill();

    // 嘴
    ctx.strokeStyle = `hsl(${hue}, ${sat}%, ${light - 20}%)`;
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.beginPath();
    ctx.arc(bodyLen * 0.5, r * 0.1, r * 0.14, -0.5, 0.6);
    ctx.stroke();

    // 玩家光环
    if (isPlayer) {
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBubbles() {
    ctx.save();
    ctx.strokeStyle = "rgba(210,240,255,0.45)";
    ctx.lineWidth = 1;
    for (const b of bubbles) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHUD() {
    // 命数
    const maxLives = mode === "normal" ? 3 : 1;
    let hearts = "";
    for (let i = 0; i < maxLives; i++) hearts += (i < lives ? "❤️" : "🖤");
    livesEl.textContent = hearts;
    // 连击
    if (combo >= 2 && comboTimer > 0) {
      comboEl.style.opacity = 1;
      comboEl.textContent = `🔥 连击 x${combo}  +${combo * 3}`;
    } else {
      comboEl.style.opacity = 0;
    }
  }

  function updateHUD() {
    scoreVal.textContent = score;
    const level = Math.max(1, Math.floor((player.r - START_R) / growthPerLevel) + 1);
    levelVal.textContent = level + " 级";
    const pct = clamp((player.r - START_R) / (MAX_R - START_R) * 100, 0, 100);
    sizeFill.style.width = pct + "%";
  }

  // ---------- 主循环 ----------
  let last = 0;
  let maxSwitchTimer = null; // 深海鱼霸→我不是大肥鱼 延时切换定时器
  function loop(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;

    drawBackground();
    drawPlants();
    drawBubbles();
    for (const it of items) drawItem(it);

    if (status === "playing") {
      if (invincible > 0) invincible -= dt;
      updatePlayer(dt);
      for (const f of fishes) updateFish(f, dt);
      checkEating();
      checkAIEating();
      updateItems(dt);
      checkItemCollision();
      // 补充鱼
      const target = 26;
      if (fishes.length < target && Math.random() < 0.08) spawnFish(false);
    }

    // 粒子在 over 状态也持续消散，避免死亡后画面完全冻结的死机感
    updateParticles(dt);

    // 绘制鱼（玩家在最上层）
    for (const f of fishes) drawFish(f, false);
    if (status !== "over") drawFish(player, true);
    drawParticles();

    if (status === "playing") {
      updateBubbles(dt);
      updateHUD();
      drawHUD();
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) combo = 0;
      }
    }

    requestAnimationFrame(loop);
  }

  // ---------- 流程控制 ----------
  function startGame(m) {
    mode = m || mode || "normal";
    lives = mode === "normal" ? 3 : 1;
    invincible = 2; // 出生保护：开局 2 秒无敌，给玩家反应时间
    startOv.classList.add("hidden");
    overOv.classList.add("hidden");
    pausedOv.classList.add("hidden");
    if (challengeRecord) challengeRecord.classList.add("hidden");
    if (challengeFail) challengeFail.classList.add("hidden");
    if (challengeMax) challengeMax.classList.add("hidden");
    if (maxSwitchTimer) { clearTimeout(maxSwitchTimer); maxSwitchTimer = null; }
    canvas.style.pointerEvents = "auto"; // 恢复画布交互
    reset();
    status = "playing";
    Sound.unlock();   // 手势内解锁音频
    Sound.start();    // 开始音效 + 背景音乐
  }

  function gameOver() {
    status = "over";
    combo = 0;
    Sound.gameOver();   // 游戏结束音效 + 停止背景音乐

    // 首局(best=0)或突破纪录：都显示「我不是大肥鱼」，并记录成绩
    const isNewRecord = score > best || best === 0;
    if (score > best) {
      best = score;
      try { localStorage.setItem("bigFishBest", String(best)); } catch (e) {}
    }

    // 先禁用画布交互，防止 canvas 拦截按钮点击
    canvas.style.pointerEvents = "none";

    if (mode === "challenge") {
      // 挑战模式：按优先级显示插图结局（带防御性 null 检查，避免 DOM 缺失导致死屏）
      const isMaxSize = player.r >= MAX_R - 5;   // 体型接近满级即视为占据全屏
      if (isMaxSize) {
        // 最高级：深海鱼霸（占据全屏）
        if (cmScore) cmScore.textContent = "得分 " + score;
        if (challengeMax) challengeMax.classList.remove("hidden");
        else if (overOv) { overOv.classList.remove("hidden"); fnewEl.textContent = ""; }
        // 若同时破纪录：先展示深海鱼霸，稍后切换为「我不是大肥鱼」
        if (isNewRecord) {
          maxSwitchTimer = setTimeout(() => {
            if (challengeMax) challengeMax.classList.add("hidden");
            if (crScore) crScore.textContent = "得分 " + score;
            if (challengeRecord) challengeRecord.classList.remove("hidden");
          }, 2500);
        }
      } else if (isNewRecord) {
        // 破纪录（突破历史成绩）但未满级：我不是大肥鱼
        if (crScore) crScore.textContent = "得分 " + score;
        if (challengeRecord) challengeRecord.classList.remove("hidden");
        else if (overOv) { overOv.classList.remove("hidden"); fnewEl.textContent = "🎉 新纪录！"; }
      } else {
        // 未满级且未破纪录：没吃饱喵
        if (cfScore) cfScore.textContent = "得分 " + score;
        if (cfBest) cfBest.textContent = best;
        if (challengeFail) challengeFail.classList.remove("hidden");
        else if (overOv) { overOv.classList.remove("hidden"); fnewEl.textContent = ""; }
      }
    } else {
      // 普通模式
      if (isNewRecord) {
        fnewEl.textContent = "🎉 新纪录！";
      } else {
        fnewEl.textContent = "";
      }
      finalEl.textContent = "得分 " + score;
      modeTag.textContent = "普通模式 · 三条命";
      bestEl.textContent = "最高记录 " + best;
      overOv.classList.remove("hidden");
    }
    // 大爆发
    burst(player.x, player.y, 0, 20);
  }

  function togglePause() {
    if (status === "playing") { status = "paused"; pausedOv.classList.remove("hidden"); }
    else if (status === "paused") { status = "playing"; pausedOv.classList.add("hidden"); last = performance.now(); }
  }

  // ---------- 输入 ----------
  function setTarget(cx, cy) {
    const rect = canvas.getBoundingClientRect();
    targetX = cx - rect.left;
    targetY = cy - rect.top;
  }
  window.addEventListener("mousemove", e => setTarget(e.clientX, e.clientY));
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.touches[0];
    if (t) setTarget(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.touches[0];
    if (t) setTarget(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") {
      if (status === "idle") startGame("normal");
      else if (status === "over") startGame(mode);
    }
    if (e.key === "Escape" || e.key.toLowerCase() === "p") togglePause();
    if (e.key.toLowerCase() === "m") toggleSound();
  });
  $("startBtn").addEventListener("click", () => { Sound.unlock(); startGame("normal"); });
  $("challengeBtn").addEventListener("click", () => { Sound.unlock(); startGame("challenge"); });
  $("restartBtn").addEventListener("click", () => { Sound.unlock(); startGame(mode); });
  $("crRestartBtn").addEventListener("click", () => { Sound.unlock(); startGame("challenge"); });
  $("cfRestartBtn").addEventListener("click", () => { Sound.unlock(); startGame("challenge"); });
  $("cmRestartBtn").addEventListener("click", () => { Sound.unlock(); startGame("challenge"); });

  // 静音开关
  const soundBtn = $("soundToggle");
  if (Sound.isMuted()) { soundBtn.classList.add("muted"); soundBtn.textContent = "🔇"; }
  function toggleSound() {
    const m = !Sound.isMuted();
    Sound.setMuted(m);
    soundBtn.classList.toggle("muted", m);
    soundBtn.textContent = m ? "🔇" : "🔊";
  }
  soundBtn.addEventListener("click", () => { Sound.unlock(); toggleSound(); });

  // 初始画面渲染（背景与鱼群展示）
  reset();
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
